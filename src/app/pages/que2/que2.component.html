
<div class="container mt-4">
    <h3>User Information</h3>

    <div class="card">
        <img src="{{urlImage}}" class="card-img-top" alt="User Image" style="width: 100px; height: 100px; object-fit: cover; border-radius: 50%; margin: auto; margin-top: 20px;">

        <div class="card-body">
            <h5 class="card-title">{{name}}</h5>

            <p class="card-text">
                <strong>Email:</strong> {{email}}
            </p>

            <p class="card-text">
                <strong>Age:</strong> {{age}}
            </p>
        </div>
    </div>
</div>
