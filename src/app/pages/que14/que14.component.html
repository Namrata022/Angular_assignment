<div class="container mt-5">
  <h2 class="mb-4">Student Marks</h2>

  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>Student Name</th>
        <th>Marks</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let student of students">
        <td>{{ student.name }}</td>
        <td [ngClass]="student.marks > 40 ? 'text-success fw-bold' : 'text-danger fw-bold'">
          {{ student.marks }}
        </td>
      </tr>
    </tbody>
  </table>
</div>
