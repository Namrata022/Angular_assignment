<div class="container mt-4">  
    <h2 class="mb-4">Products</h2>     
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" *ngIf="products && products.length">    
        <div class="col" *ngFor="let p of products">      
            <div class="card h-100">        
                <img          
                src={{p.images}}          
                class="card-img-top"          
                alt="{{ p.title }}"          
                style="height: 200px; object-fit: contain;"/>        
                <div class="card-body">          
                    <h5 class="card-title">{{ p.title }}</h5>          
                    <p class="card-text">{{ p.description | slice:0:100 }}...</p>          
                    <p class="mb-1"><strong>Price:</strong>{{ p.price |currency:'INR' }}</p>          
                    <p class="mb-0"><strong>Category:</strong> {{ p.category }}</p>        
                </div>      
            </div>    
        </div>  
    </div> 
</div>
